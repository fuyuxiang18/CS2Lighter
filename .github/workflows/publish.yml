name: Release CS2Lighter

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: package.json
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Run this workflow on the tag matching package.json.' }
      - run: vp check --no-fmt
      - run: vp run test
      - run: vp run deadcode
      - name: Validate translation catalogs
        shell: pwsh
        run: |
          vp run i18n:extract
          git diff --exit-code -- src/ui/translations src/electron-main/translations
      - run: vp run build
      - name: Package Windows installer and update manifest
        run: vp run package --win --publish never
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw "Release $tag is already public. Do not replace published updates." }
          } else {
            gh release create $tag --draft --verify-tag --title "CS2Lighter $version" --notes-file "releases/$version.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          gh release upload $tag "dist/CS2Lighter-$version-x64.exe" "dist/CS2Lighter-$version-x64.exe.blockmap" "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release stays draft because upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
