name: Release CS2Lighter

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      replace_v073:
        description: 'Replace v0.7.3 with the explicitly authorized death-risk redesign'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/death-evidence/go.sum
      - name: Validate version
        shell: pwsh
        env:
          REPLACE_V073: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_v073 }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $replacement = $env:REPLACE_V073 -eq 'true' -and $version -eq '0.7.3' -and $env:GITHUB_REF -eq 'refs/heads/main'
          if (!$replacement -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Run this workflow on the tag matching package.json.' }
      - run: vp check --no-fmt
      - run: vp run test
      - run: vp run deadcode
      - name: Validate translation catalogs
        shell: pwsh
        run: |
          vp run i18n:extract
          git diff --exit-code -- src/ui/translations src/electron-main/translations
      - run: vp run build
      - name: Package Windows installer and update manifest
        run: vp run package --win --publish never
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_V073: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_v073 }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $replacement = $env:REPLACE_V073 -eq 'true' -and $version -eq '0.7.3' -and $env:GITHUB_REF -eq 'refs/heads/main'
          foreach ($asset in @("dist/CS2Lighter-$version-x64.exe", "dist/CS2Lighter-$version-x64.exe.blockmap", 'dist/latest.yml')) {
            if (!(Test-Path -LiteralPath $asset) -or (Get-Item -LiteralPath $asset).Length -eq 0) { throw "Missing release asset: $asset" }
          }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              if (!$replacement) { throw "Release $tag is already public. Do not replace published updates." }
              # Hide the feed while replacing all three assets; never expose a partially updated manifest.
              gh release edit $tag --draft=true
              if ($LASTEXITCODE -ne 0) { throw 'Could not make the explicitly authorized replacement private' }
            }
          } else {
            gh release create $tag --draft --verify-tag --title "CS2Lighter $version" --notes-file "releases/$version.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          gh release upload $tag "dist/CS2Lighter-$version-x64.exe" "dist/CS2Lighter-$version-x64.exe.blockmap" "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release stays draft because upload failed' }
          if ($replacement) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Release stays draft because tag replacement failed' }
          }
          gh release edit $tag --draft=false --latest --notes-file "releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
