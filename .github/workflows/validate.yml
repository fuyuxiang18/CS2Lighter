name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: package.json
      # Git's CLAUDE.md symlink is a text placeholder on Windows; validate all application sources explicitly.
      - run: vp check src scripts linter types package.json electron-builder.config.mjs pnpm-workspace.yaml pnpm-lock.yaml
      - run: vp check --no-fmt
      - run: vp run test
      - run: vp run deadcode
      - name: Validate translation catalogs
        shell: pwsh
        run: |
          vp run i18n:extract
          git diff --exit-code -- src/ui/translations src/electron-main/translations
